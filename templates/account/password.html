{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Change password</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('account.change_password') }}">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" maxlength="128" required
           autocomplete="current-password">
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password" minlength="10" maxlength="128" required
           autocomplete="new-password">
    <p class="hint">At least 10 characters. Very common passwords are not allowed.</p>
    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" maxlength="128" required
           autocomplete="new-password">
    <p><button type="submit" class="button">Change password</button>
       <a href="{{ url_for('account.profile') }}">Cancel</a></p>
  </form>
</div>
{% endblock %}
