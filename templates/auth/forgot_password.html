{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Forgot your password?</h1>
  <p class="muted">Enter your email. If an account exists, we send a reset link
     (it is written to the outbox/ folder).</p>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.forgot_password') }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" maxlength="254" required
           autocomplete="email">
    <p><button type="submit" class="button">Send reset link</button></p>
  </form>
  <p><a href="{{ url_for('auth.login') }}">&larr; Back to log in</a></p>
</div>
{% endblock %}
