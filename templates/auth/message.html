{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card form-card {% if not ok %}error-card{% endif %}">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p><a href="{{ url_for('auth.login') }}">Go to log in</a>
     &middot; <a href="{{ url_for('index') }}">Home</a></p>
</div>
{% endblock %}
