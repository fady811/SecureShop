{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="card form-card">
  <h1>Choose a new password</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="10" maxlength="128" required
           autocomplete="new-password">
    <p class="hint">At least 10 characters. Very common passwords are not allowed.</p>

    <label for="confirm_password">Confirm new password</label>
    <input id="confirm_password" name="confirm_password" type="password" maxlength="128" required
           autocomplete="new-password">
    <p><button type="submit" class="button">Change password</button></p>
  </form>
</div>
{% endblock %}
